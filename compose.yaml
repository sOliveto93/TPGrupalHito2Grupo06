
services:
  mysql:
    image: mysql:8.4
    container_name: epicentro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hito2
    ports:
      - "3307:3306"

  epicentro:
    build: .
    container_name: epicentro
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hito2
      BD_USER: root
      BD_PASS: root
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
    depends_on:
      - mysql
