<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos de la unidad de venta</title>
    <link rel="stylesheet" th:href="@{/css/unidad-venta-home.css}">
</head>

<body>

    <a th:href="@{/home}">Volver al inicio</a>
    <h1>Pedidos de la unidad de venta</h1>
    <div sec:authorize="hasRole('EMPLEADO')">
        <a th:href="@{/pedido/alta}">
            Crear pedido
        </a>
    </div>
    <p th:if="${listaPedidos == null or listaPedidos.isEmpty()}">
        Todavía no hay pedidos registrados.
    </p>

    <nav class="paginacion" th:if="${totalPaginas > 1}">
    <a th:if="${paginaActual > 0}"
       th:href="@{/pedido/getPedidos-unidad-venta(id=${idUnidadVenta}, pagina=${paginaActual - 1})}">
        Anterior
    </a>

    <span>
        Página <strong th:text="${paginaActual + 1}"></strong>
        de <strong th:text="${totalPaginas}"></strong>
    </span>

    <a th:if="${paginaActual + 1 < totalPaginas}"
       th:href="@{/pedido/getPedidos-unidad-venta(id=${idUnidadVenta}, pagina=${paginaActual + 1})}">
        Siguiente
    </a>
</nav>
    <section th:each="pedido : ${listaPedidos}">
        <hr>

        <h2>
            Pedido #
            <span th:text="${pedido.id}">1</span>
        </h2>

        <p>
            Fecha:
            <span th:text="${pedido.fechaHora}"></span>
        </p>

        <h3>Detalles</h3>

        <table>
            <thead>
                <tr>
                    <th>Plato</th>
                    <th>Cantidad</th>
                    <th>Precio unitario</th>
                    <th>Subtotal</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="detalle : ${pedido.detalles}">
                    <td th:text="${detalle.nombrePlato}"></td>
                    <td th:text="${detalle.cantidad}"></td>
                    <td th:text="${detalle.precioUnitario}"></td>
                    <td th:text="${detalle.subtotal}"></td>
                </tr>
            </tbody>
        </table>

        <p>
            Total:
            <strong th:text="${pedido.total}"></strong>
        </p>
    </section>
    <nav th:if="${totalPaginas > 1}">
        <a th:if="${paginaActual > 0}"
            th:href="@{/pedido/getPedidos-unidad-venta(id=${idUnidadVenta}, pagina=${paginaActual - 1})}">
            Anterior
        </a>

        <span>
            Página
            <span th:text="${paginaActual + 1}"></span>
            de
            <span th:text="${totalPaginas}"></span>
        </span>

        <a th:if="${paginaActual + 1 < totalPaginas}"
            th:href="@{/pedido/getPedidos-unidad-venta(id=${idUnidadVenta}, pagina=${paginaActual + 1})}">
            Siguiente
        </a>
    </nav>
</body>

</html>
