<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/alta-plato.css}">
    <title>Alta de Plato</title>
</head>
<body>

    <header class="page-heading">
        <a th:href="@{/home}" class="btn-volver">
            ← Volver
        </a>
        <h1>Alta de Plato</h1>
        <p>Registrá un nuevo plato para ofrecer en tu unidad de venta.</p>
    </header>

    <main>
        <p th:if="${exito}" th:text="${exito}"
           class="alert alert-success"></p>

        <p th:if="${error}" th:text="${error}"
           class="alert alert-error"></p>

        <form th:action="@{/plato/alta}"
              th:object="${altaPlatoDto}"
              method="post">

            <div th:if="${#fields.hasErrors('*')}" style="color: red;">
                <ul>
                    <li th:each="err : ${#fields.errors('*')}"
                        th:text="${err}"></li>
                </ul>
            </div>

            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre"
                       th:field="*{nombre}" required>
            </p>

            <p>
                <label for="precio">Precio de venta:</label>
                <input type="number" id="precio"
                       th:field="*{precio}"
                       step="0.01" min="0.01" required>
            </p>

            <p>
                <label for="costo">Costo de producción:</label>
                <input type="number" id="costo"
                       th:field="*{costo}"
                       step="0.01" min="0" required>
            </p>

            <p>
                <a th:href="@{/responsable/home}">Volver a mi unidad</a>
                <button type="submit">Registrar plato</button>
            </p>
        </form>
    </main>

</body>
</html>
