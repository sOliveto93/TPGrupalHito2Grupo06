<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Epicentro Gourmet - Inicio</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>

<body>
    <header class="header">

        <!-- Usuario autenticado -->
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
            <button type="submit">Cerrar sesión</button>
        </form>

        <!-- Usuario sin loguear -->
        <form sec:authorize="isAnonymous()" th:action="@{/login}" method="get">
            <button type="submit">Iniciar Sesion</button>
        </form>

        <h1>Bienvenido al TFI</h1>

    </header>
    <main class="main">
        <section>
            <h1 class="mb-4">Sistema de gestion de personas y titulos - Universidad Nacional de Lanus</h1>
        </section>

        <div sec:authorize="hasRole('EMPLEADO')">
            <a th:href="@{/pedido/alta}" class="btn btn-primary">
                Crear pedido
            </a>
            <a th:if="${miUnidad != null}" th:href="@{/pedido/getPedidos-unidad-venta(id=${miUnidad.id})}"
                class="btn btn-primary">
                Ver pedidos de mi unidad
            </a>
            <a th:href="@{/contabilidad/sueldo}" class="btn btn-primary">
                Mis liquidaciones de sueldo
            </a>
        </div>

        </div>

        <section>
            <h2>Mi unidad de venta</h2>

            <p th:if="${errorUnidad}" th:text="${errorUnidad}"></p>

            <div th:if="${miUnidad != null}">
                <p>
                    Nombre:
                    <span th:text="${miUnidad.nombreComercial}"></span>
                </p>
                <p>
                    Código:
                    <span th:text="${miUnidad.codigo}"></span>
                </p>
                <p>
                    Superficie:
                    <span th:text="${miUnidad.superficie}"></span> m²
                </p>

                

            </div>
        </section>

        <div class="festivales">
            <div th:each="f : ${festivales}" class="card">

                <p>
                    <span th:text="${f.nombre}"></span>
                </p>

                <p>
                    Temporada:
                    <span th:text="${f.temporada}"></span>
                </p>

                <p>
                    Fecha de inicio:
                    <span th:text="${f.fechaInicio}"></span>
                </p>

                <p>
                    Fecha de fin:
                    <span th:text="${f.fechaFin}"></span>
                </p>
                <p>
                    Estado:
                    <span th:text="${f.estado}"></span>
                </p>

            </div>
        </div>
    </main>

</body>

</html>
