<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Unidad de Venta</title>
</head>
<body>

<h2>Registrar Unidad de Venta y Responsable</h2>

<div th:if="${error}" style="color: red; margin-bottom: 15px;">
    <strong th:text="${error}">Ocurrió un error al procesar el registro.</strong>
</div>

<div th:if="${exito}" style="color: green; margin-bottom: 15px;">
    <strong th:text="${exito}"></strong>
</div>

<form th:action="@{/unidad-venta/guardar}" th:object="${registroDto}" method="post">

    <div th:if="${#fields.hasErrors('*')}" style="color: red; margin-bottom: 15px;">
        <strong>Errores de validación:</strong>
        <ul>
            <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
        </ul>
    </div>

    <h3>1. Datos de la Unidad de Venta</h3>

    <p>
        <label>Festival:</label><br>
        <select th:field="*{festivalId}" required>
            <option value="" disabled selected>Seleccione un Festival</option>
            <option th:each="f : ${festivales}" th:value="${f.id}" th:text="${f.nombre}"></option>
        </select>
    </p>

    <p>
        <label>Nombre Comercial:</label><br>
        <input type="text" th:field="*{nombreComercial}" placeholder="Ej: La Hamburguesería" required>
    </p>

    <p>
        <label>Código Único (10 caracteres):</label><br>
        <input type="text" id="inputCodigo" th:field="*{codigo}" maxlength="10" placeholder="Ej: FT12345678" required>
    </p>

    <p>
        <label>Superficie (m²):</label><br>
        <input type="number" step="0.01" th:field="*{superficie}" placeholder="Ej: 15.5" required>
    </p>

    <p>
        <label>Tipo de Unidad:</label><br>
        <select th:field="*{tipoUnidad}" id="tipoUnidadSelect" onchange="toggleCamposTipo()">
            <option value="FOOD_TRUCK">Food Truck</option>
            <option value="PUESTO">Puesto Desarmable</option>
        </select>
    </p>

    <div id="camposFoodTruck">
        <p>
            <label>Patente:</label><br>
            <input type="text" th:field="*{patente}" placeholder="Ej: AA123CD">
        </p>
        <p>
            <label>
                <input type="checkbox" th:field="*{requiereElectricidad}"> Requiere Conexión Eléctrica
            </label>
        </p>
    </div>

    <div id="camposPuesto" style="display: none;">
        <p>
            <label>Cantidad de Carpas:</label><br>
            <input type="number" th:field="*{cantidadCarpas}" placeholder="Ej: 2">
        </p>
        <p>
            <label>Tiempo de Montaje (minutos):</label><br>
            <input type="number" th:field="*{tiempoMontajeMinutos}" placeholder="Ej: 45">
        </p>
    </div>

    <h3>2. Datos del Responsable (Staff)</h3>

    <p>
        <label>Nombre:</label><br>
        <input type="text" th:field="*{nombre}" placeholder="Ej: Carlos" required>
    </p>

    <p>
        <label>Apellido:</label><br>
        <input type="text" th:field="*{apellido}" placeholder="Ej: Ríos" required>
    </p>

    <p>
        <label>DNI:</label><br>
        <input type="text" th:field="*{dni}" placeholder="Ej: 30111222" required>
    </p>

    <p>
        <label>Fecha Nacimiento:</label><br>
        <input type="date" th:field="*{fechaNac}" required>
    </p>

    <p>
        <label>Fecha de Ingreso:</label><br>
        <input type="date" th:field="*{fechaIngreso}" required>
    </p>

    <h3>3. Credenciales de Usuario</h3>

    <p>
        <label>Email (Usuario):</label><br>
        <input type="email" th:field="*{email}" placeholder="Ej: carlos.rios@gmail.com" required>
    </p>

    <p>
        <label>Contraseña:</label><br>
        <input type="password" id="inputPassword" th:field="*{password}" placeholder="••••••••" required>
        <button type="button" onclick="togglePassword('inputPassword', this)">Mostrar</button>
    </p>

    <p>
        <label>Repetir Contraseña:</label><br>
        <input type="password" id="inputConfirmPassword" placeholder="••••••••" required>
        <button type="button" onclick="togglePassword('inputConfirmPassword', this)">Mostrar</button>
        <span id="passError" style="color: red; display: none;">Las contraseñas no coinciden.</span>
    </p>

    <p>
        <a href="/">Cancelar</a>
        <button type="submit">Registrar Unidad</button>
    </p>
</form>

<script>
    function toggleCamposTipo() {
        const tipo = document.getElementById("tipoUnidadSelect").value;
        const ft = document.getElementById("camposFoodTruck");
        const puesto = document.getElementById("camposPuesto");
        const inputCodigo = document.getElementById("inputCodigo");

        if (tipo === "FOOD_TRUCK") {
            ft.style.display = "block";
            puesto.style.display = "none";
            if (inputCodigo) {
                inputCodigo.placeholder = "Ej: FT12345678";
            }
        } else {
            ft.style.display = "none";
            puesto.style.display = "block";
            if (inputCodigo) {
                inputCodigo.placeholder = "Ej: PD12345678";
            }
        }
    }

    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            btn.textContent = "Ocultar";
        } else {
            input.type = "password";
            btn.textContent = "Mostrar";
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        const form = document.querySelector("form");
        form.addEventListener("submit", function (e) {
            const pass = document.getElementById("inputPassword").value;
            const confirmPass = document.getElementById("inputConfirmPassword").value;
            const errorSpan = document.getElementById("passError");

            if (pass !== confirmPass) {
                e.preventDefault();
                errorSpan.style.display = "inline";
            } else {
                errorSpan.style.display = "none";
            }
        });
    });
</script>
</body>
</html>
