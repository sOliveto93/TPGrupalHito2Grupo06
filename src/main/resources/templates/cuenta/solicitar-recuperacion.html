<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" th:href="@{/css/cuenta.css}">
</head>
<body>

<div class="page-heading">
    <h1>Recuperar contraseña</h1>
    <p>Ingresá tu email para recibir un enlace de recuperación.</p>
</div>

<p th:if="${exito}" th:text="${exito}"
   class="alert alert-success"></p>

<p th:if="${error}" th:text="${error}"
   class="alert alert-error"></p>

<form th:action="@{/recuperar-contrasenia}"
      th:object="${solicitudDto}"
      method="post">

    <div th:if="${#fields.hasErrors('*')}" class="alert alert-error">
        <ul>
            <li th:each="err : ${#fields.errors('*')}"
                th:text="${err}"></li>
        </ul>
    </div>

    <p>
        <label for="email">Email:</label>
        <input type="email"
               id="email"
               th:field="*{email}"
               autocomplete="email"
               required>
    </p>

    <p class="form-actions">
        <a th:href="@{/login}">Volver al login</a>
        <button type="submit">Enviar enlace</button>
    </p>
</form>

</body>
</html>
