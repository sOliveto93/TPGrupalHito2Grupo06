<!DOCTYPE html>
<lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head>
        <meta charset="UTF-8">
        <title>Epicentro Gourmet - Inicio</title>
        <link rel="stylesheet" th:href="@{/css/home.css}">
    </head>

    <body>
        <header class="header">

            <!-- Usuario autenticado -->
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                <button type="submit">Cerrar sesión</button>
            </form>

            <!-- Usuario sin loguear -->
            <form sec:authorize="isAnonymous()" th:action="@{/login}" method="post">
                <button type="submit">Iniciar Sesion</button>
            </form>

            <h1>Bienvenido al TFI</h1>

        </header>
        <main class="main">
            <section>
                <h1 class="mb-4">Sistema de gestion de personas y titulos - Universidad Nacional de Lanus</h1>
            </section>
            <div class="">
                <button>
                    <a th:href="@{/unidad-venta/registro-unidad}" class="btn btn-primary">
                        Registrar Unidad de Venta
                    </a>
                </button>

            </div>
            <div class="festivales">
                <div th:each="f : ${festivales}" class="card">
                    <p>
                        <span th:text="${f.nombre}"></span>
                    </p>

                    <p>
                        Temporada:
                        <span th:text="${f.temporada}"></span>
                    </p>

                    <p>
                        Fecha de inicio:
                        <span th:text="${f.fechaInicio}"></span>
                    </p>

                    <p>
                        Fecha de fin:
                        <span th:text="${f.fechaFin}"></span>
                    </p>
                    <a th:href="@{/unidad-venta/unidad-venta-por-festival(id=${f.id})}"
                        class="btn btn-primary">
                        Mostrar unidades de venta
                    </a>
                </div>
            </div>
        </main>

    </body>

    </html>
