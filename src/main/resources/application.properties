spring.application.name=hito2
spring.datasource.url=jdbc:mysql://localhost:3306/hito2
spring.datasource.username=${BD_USER}
spring.datasource.password=${BD_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#spring.sql.init.mode=always
#spring.jpa.defer-datasource-initialization=true

spring.thymeleaf.cache=false

spring.security.user.name=${APP_NAME}
spring.security.user.password=${APP_PASS}
spring.security.user.roles=${APP_ROLE}